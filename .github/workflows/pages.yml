name: pages
# Builds the web UI with the latest EX-CT/eve-sde-pipeline dataset release and the in-browser engines
# (variant D TypeScript bundle, variant F Rust->WASM, graphs-g4 Rust->WASM pinned in engines.lock), smoke-tests it in headless Chrome, deploys to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dataset_tag:
        description: "eve-sde-pipeline release tag (default: latest)"
        required: false
        default: ""
      default_engine:
        description: "default engine backend (ts-worker | wasm-worker | wasm-g4-worker | http); empty = repo variable DEFAULT_ENGINE or ts-worker"
        required: false
        default: ""
  schedule:
    - cron: "40 */6 * * *"   # pick up new SDE releases / engine updates
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      # default engine backend of the site: dispatch input > repo variable DEFAULT_ENGINE > ts-worker
      DEFAULT_ENGINE: ${{ github.event.inputs.default_engine || vars.DEFAULT_ENGINE || 'ts-worker' }}
    steps:
      - uses: actions/checkout@v4
      - name: Pinned engine commits (engines.lock)
        run: grep -E '^[A-Z0-9_]+=[^[:space:]#]+$' engines.lock | tee -a "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Dataset from the SDE pipeline release
        run: |
          TAG="${{ github.event.inputs.dataset_tag }}"
          [ -z "$TAG" ] && TAG=$(gh release view -R EX-CT/eve-sde-pipeline --json tagName --jq .tagName)
          mkdir -p public/data dl
          gh release download "$TAG" -R EX-CT/eve-sde-pipeline -D dl -p 'dataset-*.json.gz' -p manifest.json -p LICENSE.EVE
          cp dl/dataset-*.json.gz public/data/dataset.json.gz; cp dl/manifest.json public/data/manifest.json; cp dl/LICENSE.EVE public/data/
          # SDE-derived presets (implant sets, NPC damage / target profiles; CCP data + MIT, no Pyfa data), from r5 on
          if gh release download "$TAG" -R EX-CT/eve-sde-pipeline -D dl -p presets.json; then
            node tools/slim-presets.mjs dl/presets.json public/data/presets-web.json | tee -a "$GITHUB_STEP_SUMMARY"
          else echo "no presets.json in $TAG: implant sets / NPC profiles disabled" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "DATASET_TAG=$TAG" >> "$GITHUB_ENV"
          echo "dataset: $TAG ($(ls dl/dataset-*))" >> "$GITHUB_STEP_SUMMARY"
      - name: Engine D (TypeScript, browser bundle)
        run: |
          git clone -q --depth 1 -b variant-d https://github.com/EX-CT/eve-dogma-lab lab-d
          (cd lab-d/variant-d && npm ci --no-audit --no-fund && npm run build:web)
          mkdir -p public/engines/d
          cp lab-d/variant-d/dist-web/eve-dogma-ts.mjs public/engines/d/
          cp lab-d/variant-d/LICENSE public/engines/d/LICENSE 2>/dev/null || cp lab-d/LICENSE public/engines/d/LICENSE 2>/dev/null || true
          echo "ENGINE_D=$(git -C lab-d rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Engine F (Rust -> WASM, dataset compiled in)
        continue-on-error: true
        run: |
          git clone -q --depth 1 -b variant-f https://github.com/EX-CT/eve-dogma-lab lab-f
          rustup target add wasm32-unknown-unknown
          (cd lab-f/variant-f && EVE_DOGMA_DATASET="$GITHUB_WORKSPACE/public/data/dataset.json.gz" cargo build --lib --profile release-small --target wasm32-unknown-unknown)
          mkdir -p public/engines/f
          cp lab-f/variant-f/target/wasm32-unknown-unknown/release-small/eve_dogma_f.wasm public/engines/f/
          echo "ENGINE_F=$(git -C lab-f rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Engine F + graph RPC (graphs-g4 @ engines.lock GRAPHS_G4_SHA, round-2 prototype; Rust -> WASM + native)
        continue-on-error: true
        run: |
          git init -q lab-g4 && git -C lab-g4 fetch -q --depth 1 https://github.com/EX-CT/eve-dogma-lab "$GRAPHS_G4_SHA" && git -C lab-g4 checkout -q FETCH_HEAD
          rustup target add wasm32-unknown-unknown
          export EVE_DOGMA_DATASET="$GITHUB_WORKSPACE/public/data/dataset.json.gz"
          (cd lab-g4/graphs-g4 && cargo build --lib --profile release-small --target wasm32-unknown-unknown)
          mkdir -p public/engines/g4
          cp lab-g4/graphs-g4/target/wasm32-unknown-unknown/release-small/eve_dogma_f.wasm public/engines/g4/
          cp lab-g4/graphs-g4/LICENSE public/engines/g4/LICENSE 2>/dev/null || true
          echo "ENGINE_G4=$(git -C lab-g4 rev-parse --short HEAD)" >> "$GITHUB_ENV"
          # native serve-stdio build for the http-backend e2e (tools/engine-bridge.mjs); not deployed
          (cd lab-g4/graphs-g4 && cargo build --release --bin eve-dogma-f) && cp lab-g4/graphs-g4/target/release/eve-dogma-f "$RUNNER_TEMP/eve-dogma-g4"
      - name: Engine J (round-1 winner; C++20 -> WASM via Emscripten, engines.lock ENGINE_J_SRC)
        continue-on-error: true
        run: |
          src=${ENGINE_J_SRC%%@*}; rest=${ENGINE_J_SRC#*@}; sha=${rest%%:*}; dir=${rest#*:}
          git init -q lab-j && git -C lab-j fetch -q --depth 1 "https://github.com/$src" "$sha" && git -C lab-j checkout -q FETCH_HEAD
          command -v ninja >/dev/null || sudo apt-get install -y -q ninja-build
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk "$RUNNER_TEMP/emsdk"
          (cd "$RUNNER_TEMP/emsdk" && ./emsdk install "$EMSDK_VERSION" >/dev/null && ./emsdk activate "$EMSDK_VERSION" >/dev/null)
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh" >/dev/null
          (cd "lab-j/$dir" && emcmake cmake -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release && ninja -C build-wasm)
          mkdir -p public/engines/j
          cp "lab-j/$dir/build-wasm/evej.mjs" "lab-j/$dir/build-wasm/evej.wasm" public/engines/j/
          cp "lab-j/$dir/LICENSE" public/engines/j/LICENSE; cp "lab-j/$dir/LICENSE.GPL-3.0" public/engines/j/ 2>/dev/null || true
          { echo "ENGINE_J=$(git -C lab-j rev-parse --short HEAD)"; echo "ENGINE_J_REPO=$src"; echo "ENGINE_J_DIR=${dir#.}"; } >> "$GITHUB_ENV"
      - name: Build info
        run: |
          # never deploy a default backend whose engine was not built (its build steps are continue-on-error)
          case "$DEFAULT_ENGINE" in
            wasm-j-worker)  need=public/engines/j/evej.wasm ;;
            wasm-g4-worker) need=public/engines/g4/eve_dogma_f.wasm ;;
            wasm-worker)    need=public/engines/f/eve_dogma_f.wasm ;;
            *)              need= ;;
          esac
          if [ -n "$need" ] && [ ! -f "$need" ]; then echo "default backend $DEFAULT_ENGINE: $need was not built" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
          if [ "$DEFAULT_ENGINE" = wasm-j-worker ] && [ ! -f public/engines/g4/eve_dogma_f.wasm ]; then echo "::warning::graphs fallback engine g4 missing; graphs use UI approximations"; fi
          echo "VITE_DEFAULT_ENGINE=$DEFAULT_ENGINE" >> "$GITHUB_ENV"
          printf '{"dataset_tag":"%s","engine_d":"%s","engine_f":"%s","engine_g4":"%s","engine_j":"%s","engine_j_repo":"%s","engine_j_dir":"%s","web":"%s","built_at":"%s","default_engine":"%s","run":"%s"}\n' \
            "$DATASET_TAG" "${ENGINE_D:-}" "${ENGINE_F:-}" "${ENGINE_G4:-}" "${ENGINE_J:-}" "${ENGINE_J_REPO:-}" "${ENGINE_J_DIR:-}" "${GITHUB_SHA::7}" "$(date -u +%FT%TZ)" "$DEFAULT_ENGINE" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > public/build-info.json
          cat public/build-info.json
      - run: npm run build
      - name: Smoke test (headless Chrome computes the demo fit)
        run: |
          set -o pipefail
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4173/eve-fit-web/ && break; sleep 1; done
          node tools/smoke.mjs http://127.0.0.1:4173/eve-fit-web/ ts-worker | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f public/engines/f/eve_dogma_f.wasm ]; then node tools/smoke.mjs http://127.0.0.1:4173/eve-fit-web/ wasm-worker | tee -a "$GITHUB_STEP_SUMMARY" || echo "wasm backend smoke failed" >> "$GITHUB_STEP_SUMMARY"; fi
          node tools/e2e.mjs http://127.0.0.1:4173/eve-fit-web/ ts-worker | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f public/engines/f/eve_dogma_f.wasm ]; then node tools/e2e.mjs http://127.0.0.1:4173/eve-fit-web/ wasm-worker | tee -a "$GITHUB_STEP_SUMMARY" || echo "wasm backend e2e failed" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f public/engines/g4/eve_dogma_f.wasm ]; then node tools/e2e.mjs http://127.0.0.1:4173/eve-fit-web/ wasm-g4-worker | tee -a "$GITHUB_STEP_SUMMARY" || echo "graphs-g4 backend e2e failed" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f public/engines/j/evej.wasm ]; then
            if [ "$DEFAULT_ENGINE" = wasm-j-worker ]; then node tools/e2e.mjs http://127.0.0.1:4173/eve-fit-web/ wasm-j-worker | tee -a "$GITHUB_STEP_SUMMARY"
            else node tools/e2e.mjs http://127.0.0.1:4173/eve-fit-web/ wasm-j-worker | tee -a "$GITHUB_STEP_SUMMARY" || echo "J backend e2e failed" >> "$GITHUB_STEP_SUMMARY"; fi
          fi
          if [ -x "$RUNNER_TEMP/eve-dogma-g4" ]; then
            node tools/engine-bridge.mjs --stdio "$RUNNER_TEMP/eve-dogma-g4 serve-stdio" --port 8787 &
            for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8787/healthz && break; sleep 1; done
            node tools/e2e.mjs "http://127.0.0.1:4173/eve-fit-web/?http=http://127.0.0.1:8787" http | tee -a "$GITHUB_STEP_SUMMARY" || echo "http backend e2e failed" >> "$GITHUB_STEP_SUMMARY"
          fi
        env: { CHROME: /usr/bin/google-chrome }
      - name: Graphs 0.2 case suite in the browser build (wasm-g4-worker, eve-dogma-bench @ engines.lock GRAPHS_BENCH_SHA)
        if: hashFiles('public/engines/g4/eve_dogma_f.wasm') != ''
        continue-on-error: true
        run: |
          git init -q bench && git -C bench fetch -q --depth 1 https://github.com/EX-CT/eve-dogma-bench "$GRAPHS_BENCH_SHA" && git -C bench checkout -q FETCH_HEAD
          npx vite preview --host 127.0.0.1 --port 4174 --strictPort &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4174/eve-fit-web/ && break; sleep 1; done
          python3 bench/graphs/run_graphs.py --name web-g4-browser --rpc-cmd "node $GITHUB_WORKSPACE/tools/browser-rpc.mjs http://127.0.0.1:4174/eve-fit-web/ wasm-g4-worker" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c "import json,sys; c=json.load(open('bench/results/graphs-web-g4-browser/scorecard.json')); print(f\"browser graphs suite: {c['cases_fully_correct']}/{c['cases']} cases, {c['values_correct']}/{c['values_total']} values\"); sys.exit(c['cases_fully_correct'] != c['cases'])"
        env: { CHROME: /usr/bin/google-chrome }
      - name: Dogma bench 1.8.0 (326 cases) in the browser build (wasm-j-worker, eve-dogma-bench @ engines.lock DOGMA_BENCH_SHA)
        if: hashFiles('public/engines/j/evej.wasm') != ''
        run: |
          git init -q bench180 && git -C bench180 fetch -q --depth 1 https://github.com/EX-CT/eve-dogma-bench "$DOGMA_BENCH_SHA" && git -C bench180 checkout -q FETCH_HEAD
          npx vite preview --host 127.0.0.1 --port 4175 --strictPort &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4175/eve-fit-web/ && break; sleep 1; done
          python3 tools/browser-dogma-bench.py bench180 http://127.0.0.1:4175/eve-fit-web/ wasm-j-worker | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash -eo pipefail {0}
        env: { CHROME: /usr/bin/google-chrome }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
